name: Build Laya-Jev CUDA12.0 Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击触发
    inputs:
      download_model:
        description: "构建期把模型烘焙进镜像（true=镜像自包含可离线运行，体积大；false=保持轻量，运行时自动下载）"
        required: false
        default: true
        type: boolean

env:
  DOCKER_IMAGE_NAME: laya-jev-api
  DOCKER_TAG: cuda12.0
  HF_MODEL_REPO: ConvAI/Laya
  HF_TOKEN: ${{ secrets.HF_TOKEN }} # 私有模型需要，公模可以不填
  GHCR_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # - name: Increase disk space
      #   uses: actions/setup-disk@v1
      #   with:
      #     size: 50 # GB，模型+镜像非常大，至少50G

      - name: Clean docker image cache
        shell: bash
        # if: ${{ github.repository == 'luoweb/inference' }}
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========= 认证二选一：GHCR 或者 DockerHub =========
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Login to DockerHub
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./api/
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_REPO }}:${{ env.DOCKER_TAG }}
          build-args: |
            HF_TOKEN=${{ env.HF_TOKEN }}
            DOWNLOAD_MODEL=${{ inputs.download_model || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build only (PR，不推送)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          build-args: |
            HF_TOKEN=${{ env.HF_TOKEN }}
            DOWNLOAD_MODEL=${{ inputs.download_model || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 可选：导出镜像tar作为artifacts（离线包，文件巨大慎用）
      # - name: Export docker tar artifact
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     outputs: type=docker,dest=./laya-jev-cuda120.tar
      # - name: Upload tar artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: laya-jev-offline-image
      #     path: ./laya-jev-cuda120.tar
